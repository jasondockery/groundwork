# Groundwork's Herdr baseline keeps the same prefix and core mnemonics as its
# tmux setup. `groundwork-herdr-config edit` opens this source; user-owned
# configuration is never overwritten silently.
onboarding = false

[theme]
name = "catppuccin"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "ctrl+a"

# Keep displaced built-ins reachable when Groundwork reuses s, r, and T.
help = "prefix+?"
settings = "prefix+shift+s"
detach = "prefix+d"
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"
copy_mode = "prefix+["

# Pane keys match Groundwork tmux. Direct Ctrl+Alt navigation is available
# without stealing Alt+h/j/k/l from Neovim's tmux-aware navigator.
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
close_pane = "prefix+x"
zoom = "prefix+z"
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]
# Herdr 0.8 reserves Shift+h/j/k/l for pane swaps. Groundwork uses those
# chords for resizing, so remove the defaults before registering commands.
swap_pane_left = []
swap_pane_down = []
swap_pane_up = []
swap_pane_right = []
rename_pane = "prefix+shift+p"

# Herdr tabs carry the tmux window shortcuts; workspaces carry session intent.
new_tab = "prefix+c"
rename_tab = "prefix+comma"
close_tab = "prefix+ampersand"
switch_tab = "prefix+1..9"
previous_tab = "prefix+p"
next_tab = "prefix+n"
workspace_picker = "prefix+s"
goto = "prefix+shift+t"
rename_workspace = "prefix+$"

[[keys.command]]
key = "prefix+shift+h"
type = "shell"
command = "\"$HERDR_BIN_PATH\" pane resize --pane \"$HERDR_ACTIVE_PANE_ID\" --direction left --amount 5"
description = "resize the active pane left"

[[keys.command]]
key = "prefix+shift+j"
type = "shell"
command = "\"$HERDR_BIN_PATH\" pane resize --pane \"$HERDR_ACTIVE_PANE_ID\" --direction down --amount 5"
description = "resize the active pane down"

[[keys.command]]
key = "prefix+shift+k"
type = "shell"
command = "\"$HERDR_BIN_PATH\" pane resize --pane \"$HERDR_ACTIVE_PANE_ID\" --direction up --amount 5"
description = "resize the active pane up"

[[keys.command]]
key = "prefix+shift+l"
type = "shell"
command = "\"$HERDR_BIN_PATH\" pane resize --pane \"$HERDR_ACTIVE_PANE_ID\" --direction right --amount 5"
description = "resize the active pane right"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "if [ -n \"${HERDR_ACTIVE_PANE_CWD:-}\" ]; then cd \"$HERDR_ACTIVE_PANE_CWD\" || exit; fi; exec lazygit"
description = "open lazygit in the active pane directory when available"
width = "90%"
height = "90%"

[session]
resume_agents_on_restore = true

[remote]
# SSH configuration remains user/repository authority. Herdr uses plain ssh.
manage_ssh_config = false

[experimental]
allow_nested = false
# Pane output can contain secrets. Live detach preserves it without writing it.
pane_history = false

[ui]
sidebar_start_collapsed = false
mouse_capture = true
copy_on_select = true
confirm_close = true
prompt_new_tab_name = false
pane_borders = true
pane_scrollbars = false
pane_gaps = false

[ui.sound]
enabled = false
